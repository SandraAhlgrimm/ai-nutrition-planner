management:
  metrics.distribution.percentiles-histogram:
    http.server.requests: true
  tracing:
    sampling.probability: 1.0
    enabled: true
    export.otlp.enabled: true
  opentelemetry:
    tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics.export.enabled: true
    metrics.export.step: 5s
    metrics.export.url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}