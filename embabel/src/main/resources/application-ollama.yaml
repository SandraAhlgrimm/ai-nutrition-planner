spring:
  ai:
    model.chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat.options.model: ${OLLAMA_MODEL_NAME:qwen2.5}
      init.pull-model-strategy: never

embabel:
  agent:
    platform:
      llm-operations:
        prompts:
          default-timeout: 600s

nutrition-planner:
  provider: Ollama
  model: ${spring.ai.ollama.chat.options.model}
