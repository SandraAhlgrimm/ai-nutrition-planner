management:
  otlp.metrics.export:
    enabled: true
    step: 5s
  tracing:
    export.otlp.enabled: true
    sampling.probability: 1.0
  opentelemetry.tracing.export.otlp.endpoint: http://localhost:4318/v1/traces
  metrics:
    tags.application: ${spring.application.name}
    # Histogram buckets are required for percentile queries in Grafana
    distribution.percentiles-histogram:
      http.server.requests: true
      agent.duration: true
