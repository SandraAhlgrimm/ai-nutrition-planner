spring:
  application.name: langchain4j-nutrition-planner
  profiles.active: ollama
  security.user:
    name: ${SPRING_SECURITY_USER_NAME:alice}

management:
  endpoints.web.exposure.include: "*"
  otlp.metrics.export.enabled: false

nutrition-planner:
  max-validation-iterations: 3
  user-profiles:
    - username: ${SPRING_SECURITY_USER_NAME:alice}
      dietary-restrictions:
        - vegetarian
      health-goals:
        - weight-loss
        - improve-energy
      daily-calorie-target: 1800
      allergies:
        - nuts
      disliked-ingredients:
        - cilantro
        - olives
