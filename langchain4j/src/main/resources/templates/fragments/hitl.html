<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="hitl" class="bg-blue-50 border border-blue-200 rounded-lg p-5 mb-4">

    <h3 class="text-sm font-semibold text-gray-700 mb-4" th:text="${title}">A few questions before we proceed</h3>

    <form th:attr="hx-post='/interaction/' + ${interactionId} + '/answers'" hx-target="#sse-content" hx-swap="innerHTML">

        <div th:each="field : ${fields}" class="mb-4">
            <label class="block text-sm font-medium text-gray-800 mb-1" th:text="${field.label()}"></label>
            <input type="text"
                   th:name="${field.id()}"
                   th:placeholder="${field.placeholder()}"
                   class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm text-gray-700"
                   required/>
        </div>

        <button type="submit"
                class="border border-gray-400 bg-white hover:bg-gray-50 text-gray-800 font-medium px-5 py-1.5 rounded text-sm transition-colors">
            Submit
        </button>

    </form>

</div>

</body>
</html>
