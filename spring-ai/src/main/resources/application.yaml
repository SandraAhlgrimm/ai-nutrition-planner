spring:
  application.name: spring-ai-nutrition-planner
  profiles.active: openai
  security.user:
      password: 123456
      name: alice
  ai:
    tools.observations.include-content: true
    mcp.server:
      name: ${spring.application.name}
      protocol: STREAMABLE
    # Enables the Tool Search Tool pattern, see https://www.anthropic.com/engineering/advanced-tool-use
    chat.client.tool-search-advisor:
      enabled: false
      tool-index-type: lucene
      lucene.min-score-threshold: 0.4
  threads.virtual.enabled: true
  task.execution.propagate-context: true

management:
  endpoints.web.exposure.include: "*"
  otlp.metrics.export.enabled: false
  tracing.export.otlp.enabled: false
  logging.export.otlp.enabled: false

logging.level:
  org.springaicommunity: debug
  org.springframework.ai: debug

nutrition-planner:
  user-profiles:
    - name: alice
      dietary-restrictions:
        - vegetarian
      health-goals:
        - weight-loss
        - improve-energy
      daily-calorie-target: 1800
      allergies:
        - nuts
      disliked-ingredients:
        - cilantro
        - olives
